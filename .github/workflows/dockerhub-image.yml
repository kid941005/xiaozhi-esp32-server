name: Publish Docker Hub Image

# 用 GitHub Actions 构建 xiaozhi-server 镜像并同步推送到 Docker Hub。
# 需要仓库 Secrets：DOCKERHUB_USERNAME、DOCKERHUB_TOKEN（Docker Hub 账号 + Access Token，需 Read/Write 权限）。
# 缺失 Secrets 时仅构建不推送，便于先验证流水线。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本标签，例如 v0.9.9'
        required: true
        default: 'v0.9.9'
      push_latest:
        description: '同时推送 latest 标签'
        type: boolean
        default: true
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dockerhub:
    name: Build and push server image to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Check disk space
        run: df -h

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (拉取基座镜像)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DH_USER != '' && env.DH_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DH_USER }}
          password: ${{ env.DH_TOKEN }}

      - name: Warn when Docker Hub secrets are missing
        if: env.DH_USER == '' || env.DH_TOKEN == ''
        run: echo "::warning::未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，本次仅构建不推送。"

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            V="${BASH_REMATCH[1]}"
          else
            V="latest"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "resolved version: $V"

      - name: Compose image tags
        id: tags
        run: |
          REPO="${DH_USER:-local}/xiaozhi-esp32-server"
          VER="${{ steps.v.outputs.version }}"
          TAGS="$REPO:$VER"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.push_latest }}" = "true" ] && [ "$VER" != "latest" ]; then
              TAGS="$TAGS"$'\n'"$REPO:latest"
            fi
          elif [ "$VER" != "latest" ]; then
            TAGS="$TAGS"$'\n'"$REPO:latest"
          fi
          {
            echo "list<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "tags:"; echo "$TAGS"

      - name: Build and push xiaozhi-server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-server
          platforms: linux/amd64
          push: ${{ env.DH_USER != '' && env.DH_TOKEN != '' }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_PROGRESS=plain

      - name: Output image info
        if: env.DH_USER != '' && env.DH_TOKEN != ''
        run: |
          REPO="${{ env.DH_USER }}/xiaozhi-esp32-server"
          echo "✅ 已推送：$REPO:${{ steps.v.outputs.version }}"
          docker buildx imagetools inspect "$REPO:${{ steps.v.outputs.version }}" || true
