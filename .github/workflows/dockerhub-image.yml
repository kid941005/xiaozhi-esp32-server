name: Publish Images (GHCR + Docker Hub)

# 一次构建同时推送到 GHCR 与 Docker Hub（双镜像、同一组标签，linux/amd64）。
# GHCR 使用内置 GITHUB_TOKEN（需要 packages: write），无需额外 Secrets。
# Docker Hub 需要仓库 Secrets：DOCKERHUB_USERNAME、DOCKERHUB_TOKEN（账号 + Access Token，Read/Write）；
# 缺失时只推 GHCR，流水线不失败。
# 发布后执行 scripts/release/update_image_docs.sh <version> 同步 README 与 Release 说明。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本标签，例如 v0.9.10'
        required: true
        default: 'v0.9.10'
      push_latest:
        description: '同时推送 latest 标签'
        type: boolean
        default: true
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push server image (GHCR + Docker Hub)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Check disk space
        run: df -h

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # 该包由 PAT 首次创建，未与本仓库绑定，内置 GITHUB_TOKEN 会 write_package 被拒；
          # 优先用 secrets.TOKEN（PAT，write:packages），缺失时回退 GITHUB_TOKEN。
          username: ${{ github.repository_owner }}
          password: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DH_USER != '' && env.DH_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DH_USER }}
          password: ${{ env.DH_TOKEN }}

      - name: Warn when Docker Hub secrets are missing
        if: env.DH_USER == '' || env.DH_TOKEN == ''
        run: echo "::warning::未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，本次只推送 GHCR。"

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            V="${BASH_REMATCH[1]}"
          else
            V="latest"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "app_version=${V#v}" >> "$GITHUB_OUTPUT"
          echo "resolved version: $V"

      - name: Compose image tags
        id: tags
        run: |
          VER="${{ steps.v.outputs.version }}"
          GHCR_REPO="ghcr.io/${{ github.repository_owner }}/xiaozhi-esp32-server"
          TAGS="$GHCR_REPO:$VER"
          if [ -n "$DH_USER" ]; then TAGS="$TAGS"$'\n'"$DH_USER/xiaozhi-esp32-server:$VER"; fi
          PUSH_LATEST=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.push_latest }}" = "true" ] && [ "$VER" != "latest" ]; then PUSH_LATEST=true; fi
          elif [ "$VER" != "latest" ]; then
            PUSH_LATEST=true
          fi
          if [ "$PUSH_LATEST" = "true" ]; then
            TAGS="$TAGS"$'\n'"$GHCR_REPO:latest"
            if [ -n "$DH_USER" ]; then TAGS="$TAGS"$'\n'"$DH_USER/xiaozhi-esp32-server:latest"; fi
          fi
          {
            echo "list<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "tags:"; echo "$TAGS"

      - name: Build and push xiaozhi-server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-server
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_PROGRESS=plain
            APP_VERSION=${{ steps.v.outputs.app_version }}

      - name: Output image info
        run: |
          VER="${{ steps.v.outputs.version }}"
          GHCR_REPO="ghcr.io/${{ github.repository_owner }}/xiaozhi-esp32-server"
          echo "已推送 GHCR：$GHCR_REPO:$VER"
          docker buildx imagetools inspect "$GHCR_REPO:$VER" || true
          if [ -n "$DH_USER" ]; then
            echo "已推送 Docker Hub：$DH_USER/xiaozhi-esp32-server:$VER"
            docker buildx imagetools inspect "$DH_USER/xiaozhi-esp32-server:$VER" || true
          fi
          {
            echo "### 镜像已发布"
            echo ""
            echo "- GHCR: $GHCR_REPO:$VER"
            if [ -n "$DH_USER" ]; then echo "- Docker Hub: $DH_USER/xiaozhi-esp32-server:$VER"; fi
            echo ""
            echo "下一步：在仓库根执行 bash scripts/release/update_image_docs.sh $VER 同步 README 与 Release 说明。"
          } >> "$GITHUB_STEP_SUMMARY"
